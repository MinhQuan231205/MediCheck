name: CD

on:
  workflow_dispatch:
  push:
    branches: [feature/production]

jobs:
  test:
    # Runner BTC (shared, FIFO) thay vi ubuntu-latest - Actions bi chan boi billing
    # loi cua to chuc, self-hosted khong tinh phi Actions minutes nen khong bi
    # chan. Ca deploy-backend/deploy-frontend ben duoi cung da doi - can Docker +
    # Node co san tren runner BTC.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        # DATABASE_URL: file rieng cho CI, khong dinh Supabase/CockroachDB that -
        # da thu tro thang DB that (secret) nhung quyet dinh khong dung vi runner
        # BTC dung chung cho ca chuong trinh, test co insert/delete du lieu that
        # neu chua ro muc do co lap giua cac job cua cac team. Dung SQLite rieng,
        # tao moi moi lan chay (rm -f truoc khi chay vi self-hosted co the giu lai
        # workspace giua cac lan, khong dam bao sach nhu ubuntu-latest).
        run: |
          rm -f ci_test.db
          pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          # get_llm() (src/services/llm.py) doc DEEPSEEK_API_KEY, khong phai
          # OPENAI_API_KEY - thieu bien nay se loi "Missing credentials".
          DEEPSEEK_API_KEY: test-key
          DATABASE_URL: sqlite:///./ci_test.db
          DATABASE_URL_FACTS: ""

  deploy-backend:
    needs: test
    runs-on: self-hosted
    # Mac dinh GITHUB_TOKEN chi co quyen doc package -> push len GHCR that bai voi
    # "denied: permission_denied: read_package". Khai bao ro quyen ghi package.
    # Luu y: khai bao permissions se THAY THE toan bo quyen mac dinh, nen phai
    # ghi ca "contents: read" cho actions/checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker bat buoc ten repository phai viet thuong, ma
      # github.repository_owner tra ve "AI20K-Build-Phase-Cohort-3" (co chu hoa)
      # nen build that bai voi loi "repository name must be lowercase".
      # Ha chu hoa ve chu thuong truoc khi dung lam tag.
      - name: Chuan bi ten image (chu thuong)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/p-005-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-frontend:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Runner BTC KHONG cai san Node/npx (job truoc that bai voi
      # "npx: command not found"), phai tu cai truoc khi goi Vercel CLI.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Chay tu repo root (KHONG working-directory: frontend) - project Vercel da
      # cau hinh san rootDirectory: "frontend", chay CLI tu trong frontend/ se bi
      # cong don thanh frontend/frontend va khong tim thay package.json.
      #
      # Dung remote build (`vercel deploy --prod`) thay vi build local roi
      # `--prebuilt` nhu truoc - NEXT_PUBLIC_API_URL duoc danh dau "Sensitive" tren
      # Vercel nen CLI local/CI KHONG doc duoc gia tri that (build local se loi
      # "Invalid rewrite found" vi rewrite destination rong). Bien Sensitive chi
      # duoc resolve dung trong ha tang build cua chinh Vercel khi deploy remote.
      # KHONG dung `npx vercel` - npx tai goi vao cache dung chung
      # ~/.npm/_npx cua runner BTC, nhieu job cua nhieu team ghi cung luc nen
      # cache hong ("ENOTEMPTY: directory not empty, rename ... get-tsconfig").
      # Cai Vercel CLI vao thu muc rieng cua tung lan chay, kem cache npm rieng,
      # de khong dung vao trang thai dung chung cua may.
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Vercel CLI tu doc bien VERCEL_TOKEN, khong can co `--token=`.
          # Truyen qua bien moi truong an toan hon: neu gia tri secret lo dinh
          # khoang trang hay xuong dong thi dang `--token=$X` se vo cau lenh.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          # Runner self-hosted giu lai workspace giua cac lan chay (cung ly do
          # phai `rm -f ci_test.db` o job test). Thu muc .vercel con sot lai tu
          # lan chay truoc se de len VERCEL_ORG_ID/VERCEL_PROJECT_ID va gay loi
          # "Could not retrieve Project Settings". Xoa cho sach truoc khi pull.
          rm -rf .vercel

          CLI_DIR="${{ runner.temp }}/vercel-cli"
          npm install --no-save --prefix "$CLI_DIR" vercel@59
          VERCEL="$CLI_DIR/node_modules/.bin/vercel"
          # Do dai token de phat hien secret bi dan thieu/thua ky tu.
          # In do dai KHONG lam lo token; gia tri that van bi GitHub che.
          echo "--- do dai VERCEL_TOKEN: ${#VERCEL_TOKEN} ky tu (Vercel cap 24) ---"

          # whoami chi de chan doan, khong duoc lam hong job -> pull ben duoi
          # moi la buoc bao loi that su.
          echo "--- token thuoc ve ai ---"
          "$VERCEL" whoami || echo "(whoami that bai - xem ghi chu ben duoi)"

          "$VERCEL" pull --yes --environment=production
          "$VERCEL" deploy --prod
